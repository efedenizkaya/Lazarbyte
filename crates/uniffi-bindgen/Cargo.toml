[package]
name = "uniffi-bindgen"
description = "Runs uniffi's binding generator against the workspace's ffi crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# cargo-metadata is what lets `generate` read a compiled library file (the
# proc-macro route needs the library, not a UDL file).
uniffi = { version = "0.32", features = ["cli", "cargo-metadata"] }
