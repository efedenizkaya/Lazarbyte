[package]
name = "lazarbyte-core"
description = "Carving and filesystem-undelete engine for Lazarbyte (Android)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Distributed as part of the Android app, never through crates.io. Packaging it
# alone would also drop the root LICENSE-MIT/NOTICE that the MIT-derived
# sources require.
publish = false

[lib]
name = "lazarbyte_core"
path = "src/lib.rs"

[dependencies]
aho-corasick.workspace = true
aes.workspace = true
flate2.workspace = true
md-5.workspace = true
regex.workspace = true
sha1.workspace = true
sha2.workspace = true
