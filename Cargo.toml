[workspace]
resolver = "2"
members = ["crates/lazarbyte-core", "crates/lazarbyte-cli"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "Apache-2.0"

[workspace.dependencies]
# The whole point of the port: SIMD-accelerated multi-pattern search.
aho-corasick = "1.1"
sha2 = "0.10"
# AES-128/256 block cipher only; XTS, CBC, CCM and the Elephant diffuser are
# built on top here, so the BitLocker path stays auditable in one file.
aes = "0.8"
# MD5 and SHA-1 only to check an image against the hashes the acquisition
# recorded; neither is used for anything security-bearing.
md-5 = "0.10"
sha1 = "0.10"
# Byte-oriented regex for --grep --regex. Shares the aho-corasick above for its
# literal prefilter, so it costs little beyond the pattern compiler.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
# Pure-Rust inflate (miniz_oxide), for the gzip handler. No C toolchain needed.
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
# "How much room is left on this volume?" for the output directory. Small
# wrapper over statvfs (unix, including Android) and GetDiskFreeSpaceEx
# (Windows); used by the CLI only, never by the core or the app.
fs2 = "0.4"

[profile.release]
# Arithmetic on values read from an image must never wrap silently: a wrapped
# length becomes a nonsense read or an enormous allocation. The parsers use
# checked arithmetic; this makes anything missed loud rather than subtle.
overflow-checks = true
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
